<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Contact Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background-color: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif;">
    <div style="background-color: #222; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 20px;">Sign In</h2>
        <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 10px;">
            <input type="text" id="loginName" placeholder="Username" style="padding: 10px; background: transparent; border: 1px solid #444; color: white; border-radius: 4px;">
            <input type="password" id="loginPassword" placeholder="Password" style="padding: 10px; background: transparent; border: 1px solid #444; color: white; border-radius: 4px;">
            <button onclick="login()" style="background-color: #2525a5; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Login</button>
        </div>
        <p id="loginResult" style="color: #ef4444; text-align: center; height: 20px;"></p>

        <hr style="border-color: #333; margin: 30px 0;">

        <h2 style="text-align: center; margin-bottom: 20px;">Register</h2>
        <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 10px;">
            <input type="text" id="regFirst" placeholder="First Name" style="padding: 10px; background: transparent; border: 1px solid #444; color: white; border-radius: 4px;">
            <input type="text" id="regLast" placeholder="Last Name" style="padding: 10px; background: transparent; border: 1px solid #444; color: white; border-radius: 4px;">
            <input type="text" id="regUser" placeholder="Username" style="padding: 10px; background: transparent; border: 1px solid #444; color: white; border-radius: 4px;">
            <input type="password" id="regPassword" placeholder="Password" style="padding: 10px; background: transparent; border: 1px solid #444; color: white; border-radius: 4px;">
            <button onclick="register()" style="background-color: #2525a5; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Create Account</button>
        </div>
        <p id="regResult" style="text-align: center; height: 20px;"></p>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
