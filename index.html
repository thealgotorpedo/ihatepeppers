<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager - Welcome</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="login-section">
            <h2>Sign In</h2>
            <form id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 5px;">
                    <label for="isAdmin" style="font-size: 0.9rem;">Admin Login</label>
                </div>
                <button type="submit">Login</button>
            </form>
            <p id="loginResult" style="color: red;"></p>
        </div>

        <hr>

        <!-- Registration Form -->
        <div id="register-section">
            <h2>Register</h2>
            <form id="registerForm">
                <input type="text" id="regFirstName" placeholder="First Name" required>
                <input type="text" id="regLastName" placeholder="Last Name" required>
                <input type="text" id="regUsername" placeholder="Username" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <button type="submit">Create Account</button>
            </form>
            <p id="registerResult"></p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
