<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="welcomeMessage">Your Contacts</h2>
            <button id="logoutBtn" style="background-color: #ef4444; margin-top: 0;">Logout</button>
        </div>
        
        <hr>
        
        <!-- Add Contact Form -->
        <form id="addContactForm" style="flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px;">
            <input type="text" id="contactFirst" placeholder="First Name" required style="flex: 1;">
            <input type="text" id="contactLast" placeholder="Last Name" required style="flex: 1;">
            <input type="email" id="contactEmail" placeholder="Email" required style="flex: 1;">
            <input type="tel" id="contactPhone" placeholder="Phone" style="flex: 1;">
            <button type="submit" style="margin-top: 0; flex: 0.5;">Add</button>
        </form>
        <p id="contactResult" style="text-align: center; margin-top: 10px;"></p>
        
        <hr>

        <!-- Contacts Display Table -->
        <table style="width: 100%; text-align: left; border-collapse: collapse; margin-top: 20px;">
            <thead>
                <tr style="border-bottom: 2px solid #e5e7eb;">
                    <th style="padding: 10px;">Name</th>
                    <th style="padding: 10px;">Email</th>
                    <th style="padding: 10px;">Phone</th>
                    <th style="padding: 10px;">Actions</th>
                </tr>
            </thead>
            <tbody id="contactsTableBody">
                <!-- Contacts will be injected here by JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
