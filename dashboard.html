<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container dashboard">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="welcomeMessage" style="margin-bottom: 0;">Contact Manager</h2>
            <button id="logoutButton" style="background-color: #ef4444; margin-top: 0; padding: 8px 16px;">Logout</button>
        </div>
        <hr>

        <!-- Admin Control Panel -->
        <div id="adminPanel" style="display: none; background: #fee2e2; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="color: #991b1b; margin-bottom: 10px;">Admin Tools</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="suspendUsername" placeholder="Username to Suspend" style="flex: 1;">
                <button onclick="suspendUser()" style="background-color: #b91c1c; margin: 0;">Suspend</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="changePassUsername" placeholder="Username" style="flex: 1;">
                <input type="password" id="changePassNew" placeholder="New Password" style="flex: 1;">
                <button onclick="changePassword()" style="background-color: #b91c1c; margin: 0;">Update Pass</button>
            </div>
            <p id="adminResult" style="color: #991b1b; margin-top: 10px; font-size: 0.9rem; text-align: center;"></p>
        </div>

        <!-- Add Contact Section -->
        <h3>Add New Contact</h3>
        <form id="addContactForm" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="contactFirst" placeholder="First Name" required style="flex: 1 1 45%;">
            <input type="text" id="contactLast" placeholder="Last Name" required style="flex: 1 1 45%;">
            <input type="tel" id="contactPhone" placeholder="Phone" style="flex: 1 1 45%;">
            <input type="email" id="contactEmail" placeholder="Email" style="flex: 1 1 45%;">
            <input type="text" id="contactPepper" placeholder="What pepper do they hate?" required style="flex: 1 1 100%;">
            <button type="submit" style="flex: 1 1 100%; margin-top: 0;">Add Contact</button>
        </form>
        <p id="addResult" style="text-align: center; margin-bottom: 20px; font-weight: bold;"></p>

        <hr>

        <!-- Search Section -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center;">
            <h3 style="margin: 0;">Contacts Directory</h3>
            <input type="text" id="searchInput" placeholder="Search names..." style="flex: 1; margin-left: auto;">
            <button onclick="searchContacts()" style="margin: 0;">Search</button>
        </div>

        <!-- Dynamic Contacts List -->
        <div id="contactsList">
            <p style="text-align: center; color: #6b7280;">Loading contacts...</p>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
